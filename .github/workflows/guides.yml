# myejin/pub-temp 의 .github/workflows/guides.yml 로 넣는다.
# 매일 새벽 5시(서울)에 main 의 guides.json 을 새로 만든다. 바뀐 게 있을 때만 커밋한다.
# develop 은 필요할 때 Actions → Run workflow 에서 갈래를 develop 으로 골라 직접 돌린다.
# 스크립트(scripts/guides)는 늘 main 의 것을 쓰고, 결과 guides.json 만 고른 갈래에 커밋한다 —
# develop 에 스크립트를 따로 올려 둘 필요가 없다. develop 에는 초안(draft) 보관법도 들어간다.
name: guides.json

on:
  schedule:
    - cron: "0 20 * * *" # 05:00 KST
  workflow_dispatch:
    inputs:
      branch:
        description: guides.json 을 만들 갈래
        type: choice
        options: [main, develop]
        default: main

permissions:
  contents: write

concurrency:
  group: guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 스케줄 실행에는 inputs 가 없어 main 이 된다.
      TARGET: ${{ inputs.branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}
      - name: 스크립트는 main 에서
        uses: actions/checkout@v4
        with:
          ref: main
          path: _tools
          sparse-checkout: scripts/guides
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: guides.json 만들기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          TARGET_BRANCH: ${{ env.TARGET }}
        run: node _tools/scripts/guides/collect.mjs
      - name: 바뀌었으면 커밋
        run: |
          commit() {
            git config user.name "guides-bot"
            git config user.email "guides-bot@users.noreply.github.com"
            git add guides.json
            git commit -m "guides.json 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          }
          # 처음 만드는 날은 저장소에 파일이 없다 — git diff 는 새 파일을 못 보므로 따로 가른다.
          if ! git ls-files --error-unmatch guides.json >/dev/null 2>&1; then
            echo "guides.json 을 처음 올려요"
            commit
            exit 0
          fi
          if git diff --quiet -- guides.json; then
            echo "바뀐 게 없어요"
            exit 0
          fi
          # generatedAt 만 바뀐 날은 커밋하지 않는다 — 앱이 같은 내용을 다시 받을 까닭이 없다.
          if git diff -U0 -- guides.json | grep '^[+-] ' | grep -v '"generatedAt"' | grep -q .; then
            commit
          else
            echo "생성 시각만 바뀌었어요"
          fi
