# myejin/pub-temp 의 .github/workflows/guides.yml 로 넣는다.
# 매일 새벽 5시(서울)에 main 의 guides.json 을 새로 만든다. 바뀐 게 있을 때만 커밋한다.
#
# 스크립트(scripts/guides)는 **워크플로를 돌린 갈래**의 것을 쓴다. 정기 실행과, 손으로 돌릴 때의 기본값
# ("Use workflow from: main")은 main 이라 평소에는 main 의 스크립트가 main 에 쓴다.
# 새 스크립트는 develop 에 올리고 Actions → guides.json → Run workflow 에서 "Use workflow from" 을 develop 으로 골라
# 시험한다. main 이 아닌 갈래에서 돌리면 결과는 **늘 그 갈래에** 쓴다(아래 대상 칸이 main 이어도) — 시험 중인
# 스크립트가 실사용자가 받는 main 을 건드리지 않게.
# dry_run 을 켜면 커밋하지 않고, 로그에 소스별 건수·뺀 일정·넣은 일정을 다 찍고, 결과와 받은 원본 응답을
# 아티팩트로 올린다(원본은 scripts/guides/fixtures 처럼 시험 응답으로 쓸 수 있다). 이 저장소는 공개라 로그와
# 아티팩트도 공개다 — 공공데이터라 괜찮지만, 요청 주소(키가 들어 있다)는 스크립트가 찍지 않는다.
name: guides.json

on:
  schedule:
    - cron: "0 20 * * *" # 05:00 KST
  workflow_dispatch:
    inputs:
      branch:
        description: guides.json 을 만들 갈래 (main 에서 돌릴 때만 — 다른 갈래에서 돌리면 그 갈래에 써요)
        type: choice
        options: [main, develop]
        default: main
      dry_run:
        description: 커밋하지 않고 로그·아티팩트로만 보기
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 스케줄 실행에는 inputs 가 없어 main 이 된다. main 이 아닌 갈래에서 돌리면 그 갈래.
      TARGET: ${{ github.ref_name == 'main' && (inputs.branch || 'main') || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}
      - name: 스크립트는 돌린 갈래에서
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _tools
          sparse-checkout: scripts/guides
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수집기 시험 (네트워크 없이)
        run: node --test _tools/scripts/guides/lib.test.mjs _tools/scripts/guides/collect.test.mjs
      - name: guides.json 만들기
        id: collect
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          TARGET_BRANCH: ${{ env.TARGET }}
          GUIDES_SAVE_RAW: ${{ env.DRY_RUN == '1' && 'raw' || '' }}
        run: node _tools/scripts/guides/collect.mjs
      - name: 결과 올리기 (dry run)
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: guides-dry-run
          path: |
            guides.json
            raw/
          retention-days: 3
      - name: 바뀌었으면 커밋
        if: env.DRY_RUN != '1'
        run: |
          commit() {
            git config user.name "guides-bot"
            git config user.email "guides-bot@users.noreply.github.com"
            git add guides.json
            git commit -m "guides.json 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          }
          # 처음 만드는 날은 저장소에 파일이 없다 — git diff 는 새 파일을 못 보므로 따로 가른다.
          if ! git ls-files --error-unmatch guides.json >/dev/null 2>&1; then
            echo "guides.json 을 처음 올려요"
            commit
            exit 0
          fi
          if git diff --quiet -- guides.json; then
            echo "바뀐 게 없어요"
            exit 0
          fi
          # generatedAt 만 바뀐 날은 커밋하지 않는다 — 앱이 같은 내용을 다시 받을 까닭이 없다.
          if git diff -U0 -- guides.json | grep '^[+-] ' | grep -v '"generatedAt"' | grep -q .; then
            commit
          else
            echo "생성 시각만 바뀌었어요"
          fi
      # 소스 하나를 못 받은 날은 어제 것으로 채워 커밋까지 하고, 여기서 빨간불을 켠다 — GitHub 이 실패 메일을 보낸다.
      # 관광공사 키(TOURAPI_KEY)는 2028-11-04 에 만료된다. 그때 이 단계가 「한국관광공사 축제」로 실패한다.
      - name: 못 받은 소스가 있으면 실패로
        if: steps.collect.outputs.failed != ''
        env:
          FAILED: ${{ steps.collect.outputs.failed }}
        run: |
          echo "::error::못 받은 소스: $FAILED — 어제 것으로 채웠어요. 로그와 키(만료일)를 확인해 주세요."
          exit 1
